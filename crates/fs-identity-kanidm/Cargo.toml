[package]
name = "fs-identity-kanidm"
description = "Kanidm adapter of the FreeSynergy GroupDirectory: mirrors groups over Kanidm's REST API v1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The mirror interface we implement, and the types it speaks.
fs-groups-core = { git = "https://github.com/FreeSynergy/fs-groups", tag = "v0.1.0" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
# Our own small client: HTTPS with rustls, no Kanidm crates (research note 1.5).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
